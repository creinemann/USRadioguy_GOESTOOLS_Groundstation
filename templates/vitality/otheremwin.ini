; Station bulletins: national ones everyone sees (Nov 2026).
; Local warnings and forecasts (your NWS office, lakes, marine) are picked by each
; viewer in the Earth Lab: EMWIN > Bulletins > Choose your bulletins.

[ADMSDM]
identifier = "ADMSDM.*"
title = "SDM OPS Status Messages"
format = paragraph
truncate = 3

[SPACE]
identifier = "(ALT|WAT).*"
title = "Space Weather Messages"
format = paragraph
truncate = 3

[RADAR]
identifier = "FTM.*"
title = "Radar Outages"
format = paragraph
truncate = 0

[TROPSUMA]
identifier = "HAWT20US.*"
title = "NORTH ATLANTIC - TROPICAL / SUBTROPICAL WEATHER OUTLOOK"
format = paragraph
truncate = 0

[TROPSUMB]
identifier = "HEWZ20US.*"
title = "E. NORTH PACIFIC - TROPICAL / SUBTROPICAL WEATHER OUTLOOK"
format = paragraph
truncate = 0

[NATD]
identifier = "HATT20US.*"
title = "NORTH ATLANTIC - TROPICAL WEATHER DISCUSSION"
format = paragraph
truncate = 0

[ENPD]
identifier = "HETNHCUS.*"
title = "E. NORTH PACIFIC - TROPICAL WEATHER DISCUSSION"
format = paragraph
truncate = 0

[ADMINALERT]
identifier = "ADA.*"
title = "EMWIN Admin Alerts"
format = paragraph
truncate = 0

[ADMINREGIONAL]
identifier = "ADR.*"
title = "EMWIN Regional Admin Message"
format = paragraph
truncate = 4

[SWODY1US]
identifier = "SWODY1US.*"
title = "Severe Storm Outlook Narrative (AC)"
format = paragraph
truncate = 0

[VOLCANO]
identifier = "FVX.*"
title = "Volcanic Eruption"
format = paragraph
truncate = 0

[CIVILEMERGENCY]
identifier = "CEM.*"
title = "Civil Emergency"
format = paragraph
truncate = 0

[NATIONALATTACK]
identifier = "AWG.*"
title = "National Attack"
format = paragraph
truncate = 0

[LAWENFORCE]
identifier = "LEW.*"
title = "Law Enforcement Warnings"
format = paragraph
truncate = 0

[LOCALAREAEMERG]
identifier = "LAE.*"
title = "Local Area Emergency"
format = paragraph
truncate = 0
