
[_category_]
title = "Full Disk"
icon = globe-americas

[global_geo]
path = {GEO}/
title = "Global Geo Sat Imagery"
;Global imagery processed via script using Sanchez v1.0.26.1 Image Magick and custom usradioguy scripting https://usradioguy.com/geo-ring-composites/
fast = true
mode = global
filter = GOES
color = #bb7600

[GRB_CONUS]
path = {SDO}/
title = "CONUS from GRB"
;GRB Imagery Relayed via GCMSFC ESB prcessed with CSPP Geo GRB Version 1.0.28 and LightningCast V1.0 Beta 2 Software, 6 March 2025 https://cimss.ssec.wisc.edu/csppgeo/grb_v1.0.28.html
fast = true
mode = end
filter = conus_abi_
color = #bb7600

[MODIS TRUECOLOR]
path = {MODIS}/
title = "MODIS - True Color"
; MODIS imagery compiled and processed from data on JPSS NOAA20/21 running CSPP SDR Version 4.1 https://cimss.ssec.wisc.edu/cspp/jpss_sdr_v4.1.shtml
fast = true
mode = modis
filter = TRUE.daily.
color = #bb7600

[SST_Global]
path = {SST}/
title = "Sea Surface Temps"
fast = true
mode = sst
filter = GoesSST_Daily_
color = #bb7600

