################################################################
# goesproc configuration - GOES-18 (West, 137.0 W) + Himawari-9 relay
# From the USRadioguy station configs (Horicon, WI), for a new install.
# Output goes under goesproc's --out folder (the installer uses ~/goes).
# LUTs and curves come from the USRadioguy goestools fork:
#   https://github.com/creinemann/goestools
# If you ALSO run a GOES-19 receiver, you can delete the NWS handlers here
# (both satellites carry the same NWS/EMWIN products).
################################################################

# Images relayed from Himawari-9.
[[handler]]
type = "image"
origin = "himawari8"
directory = "./himawari9/{region:short|lower}/{time:%Y-%m-%d}"
filename = "Himawari9_{region:short}_{channel:short}_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"

# Himawari-9 USRG_GeoColor (was Himawari false color "fc" until 26 Nov 2026).
# Himawari's VS/IR use different scales than GOES ch02/ch13; the two
# remap curves put them on the GOES scale so the USRadioguy LUT shows
# green land instead of orange/red.
[[handler]]
type = "image"
origin = "himawari8"
channels = [ "vs", "ir" ]
directory = "./himawari9/{region:short|lower}/USRG_GeoColor/{time:%Y-%m-%d}"
filename = "Himawari9_{region:short}_USRG_GeoColor_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.remap.vs]
  path = "/usr/local/share/goestools/usradioguy/himawari9_vs_curve.png"

  [handler.remap.ir]
  path = "/usr/local/share/goestools/usradioguy/himawari9_ir_curve.png"

  # Himawari version of the USRadioguy night LUT: natural desert tan/ochre
  # land instead of deep orange-red at midday (night-side clouds visible).
  # Daytime-only: /usr/local/share/goestools/usradioguy/himawari9_lut.png
  [handler.lut]
  path = "/usr/local/share/goestools/usradioguy/himawari9_night_lut.png"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"

  # USRG_GeoColor: natural Earth colors on land (NASA Blue Marble for the
  # time of year, blended by date); ocean, clouds and night from the LUT.
  [handler.geocolor]
  path = "/usr/local/share/goestools/usradioguy/geocolor"
  satellite = "himawari9"
  strength = 1.0

# Himawari-9 water vapor (band 8, 6.2 um) with the same enhancement as
# GOES ch08. Uses the calibration (Kelvin) sent with each Himawari image.
# Named _WVENH_ so the plain _WV_ images stay separate in Vitality.

[[handler]]
type = "image"
origin = "himawari8"
channels = [ "wv" ]
directory = "./himawari9/{region:short|lower}/wv_enhanced/{time:%Y-%m-%d}"
filename = "Himawari9_{region:short}_WVENH_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.gradient.wv]
  points = [
    { units = 276, color = "#000000" },
    { units = 275.9, color = "#ff0000" },
    { units = 258, color = "#ffff00" },
    { units = 250, color = "#000070" },
    { units = 233, color = "#ffffff" },
    { units = 195, color = "#408020" },
    { units = 188, color = "#00ffff" }
  ]

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"
  color = "#000000"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"
  color = "#ff0000"

##################################################
#####        EMWIN, NWS, ADMIN MESSAGES     ######
#################################################
# NWS text/images are NOT saved here: the GOES-19 Pi saves the same
# EMWIN/NWS products (both satellites carry them). Removed 2026-11-23.

# EMWIN
[[handler]]
type = "emwin"
directory = "./goes18/emwin"
exclude_txt = false

# Miscellaneous text.
[[handler]]
type = "text"
origin = "other"
directory = "./goes18/text"
filename = "{time:%Y%m%dT%H%M%SZ}_{filename}"
json = false

# NWS images.
