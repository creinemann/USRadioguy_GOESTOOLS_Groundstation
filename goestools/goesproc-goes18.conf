#### GOES 17 SECTION ####
#########################

# GOES-18 ABI false color USRADIOGUY CH02 NO MAP and jpg.
[[handler]]
type = "image"
origin = "goes18"
regions = [ "fd" ]
channels = [ "ch02" ]
directory = "./goes18/{region:short|lower}/ch02NOMAP/{time:%Y-%m-%d}"
filename = "GOES18_{region:short}_IR_ch02NOMAP_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

# GOES-18 ABI  USRADIOGUY CH13 NO MAP and jpg.
[[handler]]
type = "image"
origin = "goes18"
regions = [ "fd" ]
channels = [ "ch13" ]
directory = "./goes18/{region:short|lower}/ch13NOMAP/{time:%Y-%m-%d}"
filename = "GOES18_{region:short}_IR_ch13NOMAP_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

# GOES-18 ABI USRG_GeoColor, NO MAP and jpg (replaces the USRadioguy CUSTOMLUT product).
[[handler]]
type = "image"
origin = "goes18"
regions = [ "fd" ]
channels = [ "ch02", "ch13" ]
directory = "./goes18/{region:short|lower}/USRG_GeoColor/{time:%Y-%m-%d}"
filename = "GOES18_{region:short}_USRG_GeoColor_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.remap.ch02]
  path = "/usr/local/share/goestools/wxstar/wxstar_goes16_ch02_curve.png"

  [handler.lut]
  path = "/usr/local/share/goestools/usradioguy/usradioguy_lut.png"

  # USRG_GeoColor: natural Earth colors on land (NASA Blue Marble for the
  # time of year, blended by date); ocean, clouds and night from the LUT.
  [handler.geocolor]
  path = "/usr/local/share/goestools/usradioguy/geocolor"
  satellite = "goes18"
  strength = 1.0

