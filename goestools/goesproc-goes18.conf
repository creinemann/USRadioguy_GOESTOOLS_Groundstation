#type = "image"
#origin = "nws"
#directory = "./nws/{time:%Y-%m-%d}"
#filename = "{time:%Y%m%dT%H%M%SZ}_{filename}"
#format = "png"
#json = false

# Miscellaneous text.
[[handler]]
type = "text"
origin = "other"
directory = "./text/{time:%Y-%m-%d}"
filename = "{time:%Y%m%dT%H%M%SZ}_{filename}"
json = false

