# goesrecv configuration - GOES-R HRIT (1694.1 MHz)
# Installed to /etc/goestools/goesrecv.conf by install.sh.
# Change "rtlsdr" to "airspy" (and the section name below) if you use an Airspy.

[demodulator]
mode = "hrit"
source = "rtlsdr"

[rtlsdr]
frequency = 1694100000
sample_rate = 2400000
# Start around 30 and adjust for your LNA/filter; watch the Viterbi
# error count on the Ground Station page (lower is better).
gain = 30
# Set to true if your LNA is powered over the coax by the RTL-SDR
bias_tee = false
device_index = 0

#[airspy]
#frequency = 1694100000
#gain = 18
#bias_tee = false

[costas]
max_deviation = 200e3

# Constellation for goesrecv-monitor
[clock_recovery.sample_publisher]
bind = "tcp://0.0.0.0:5002"
send_buffer = 2097152

# Packets for goesproc (installed as a service on this Pi)
[decoder.packet_publisher]
bind = "tcp://0.0.0.0:5004"
send_buffer = 1048576

# Signal statistics for the website's Ground Station / Receivers pages
[demodulator.stats_publisher]
bind = "tcp://0.0.0.0:6001"

[decoder.stats_publisher]
bind = "tcp://0.0.0.0:6002"

[monitor]
statsd_address = "udp4://localhost:8125"
