################################################################
# goesproc configuration - GOES-19 (East, 75.2 W)
# From the USRadioguy station configs (Horicon, WI), for a new install.
# Output goes under goesproc's --out folder (the installer uses ~/goes).
# LUTs and curves come from the USRadioguy goestools fork:
#   https://github.com/creinemann/goestools
################################################################

# 
# GOES-19 ABI  USRADIOGUY CH02 NO MAP and jpg.
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd" ]
channels = [ "ch02" ]
directory = "./goes19/{region:short|lower}/ch02NOMAP/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_IR_ch02NOMAP_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

# GOES-19 ABI  USRADIOGUY CH13 NO MAP and jpg.
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd" ]
channels = [ "ch13" ]
directory = "./goes19/{region:short|lower}/ch13NOMAP/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_IR_ch13NOMAP_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

# GOES-19 ABI USRG_GeoColor, NO MAP and jpg (replaces the USRadioguy CUSTOMLUT product).
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd" ]
channels = [ "ch02", "ch13" ]
directory = "./goes19/{region:short|lower}/USRG_GeoColor/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_USRG_GeoColor_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.remap.ch02]
  path = "/usr/local/share/goestools/wxstar/wxstar_goes16_ch02_curve.png"

  [handler.lut]
  path = "/usr/local/share/goestools/usradioguy/usradioguy_lut.png"

  # USRG_GeoColor: natural Earth colors on land (NASA Blue Marble for the
  # time of year, blended by date); ocean, clouds and night from the LUT.
  [handler.geocolor]
  path = "/usr/local/share/goestools/usradioguy/geocolor"
  satellite = "goes19"
  strength = 1.0

# GOES19 ABI false color, USRADIOGUY NIGHT LUT, NO MAP and jpg.
# Same daytime colors as usradioguycustomlut.png, plus night-side clouds.
# Added 2026-11-23 (goestools usradioguy-modernize).

[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd" ]
channels = [ "ch02", "ch13" ]
directory = "./goes19/{region:short|lower}/CUSTOMLUT_NIGHT/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_FC_NIGHTLUT_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.remap.ch02]
  path = "/usr/local/share/goestools/wxstar/wxstar_goes16_ch02_curve.png"

  [handler.lut]
  path = "/usr/local/share/goestools/usradioguy/usradioguy_night_lut.png"

# Store all original GOES-19 products.
[[handler]]
type = "image"
origin = "goes19"
directory = "./goes19/{region:short|lower}/{channel:short|lower}/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_{channel:short}_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"
  
  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"
  

# GOES-19 ABI false color. Changed to usradioguycustomlut
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd", "m1", "m2" ]
channels = [ "ch02", "ch13" ]
directory = "./goes19/{region:short|lower}/fc/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_FC_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  [handler.remap.ch02]
  path = "/usr/local/share/goestools/wxstar/wxstar_goes16_ch02_curve.png"

  [handler.lut]
  path = "/usr/local/share/goestools/usradioguy/usradioguy_lut.png"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"


# GOES-19 ABI RGB-enhanced for channels 08 and 09 only
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd" ]
channels = [ "ch08", "ch09" ]
directory = "./goes19/{region:short|lower}/{channel:short|lower}_enhanced/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_{channel:short}_enhanced_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  ## The following gradients are rough approximations of the 
  ## McIDAS RGB enhancements used by NOAA/NESDIS/STAR on their site..
  ##
  ## For more info:
  ##
  ##   https://www.star.nesdis.noaa.gov/GOES/GOES16_FullDisk.php 
  ##   http://cimss.ssec.wisc.edu/goes/visit/water_vapor_enhancement.html
  ##   http://cimss.ssec.wisc.edu/goes/visit/enhanced_v_enhancements.html
  
   ## Water Vapor (Channels 8 and 9)
  [handler.gradient.ch08]
  points = [
    { units = 276, color = "#000000" },
    { units = 275.9, color = "#ff0000" },
    { units = 258, color = "#ffff00" },
    { units = 250, color = "#000070" },
    { units = 233, color = "#ffffff" },
    { units = 195, color = "#408020" },
    { units = 178, color = "#00ffff" }
  ]
  [handler.gradient.ch09]
  points = [
    { units = 276, color = "#000000" },
    { units = 275.9, color = "#ff0000" },
    { units = 258, color = "#ffff00" },
    { units = 250, color = "#000070" },
    { units = 233, color = "#ffffff" },
    { units = 195, color = "#408020" },
    { units = 178, color = "#00ffff" }
  ]  
  
  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_0_countries_lakes.json"
  color = "#000000"

  [[handler.map]]
  path = "/usr/local/share/goestools/ne/ne_50m_admin_1_states_provinces_lakes.json"
  color = "#ff0000"

# GOES-19 ABI RGB-enhanced Channel 15 moved to its own handler below
[[handler]]
type = "image"
origin = "goes19"
regions = [ "fd", "m1", "m2" ]
channels = [ "ch07", "ch13", "ch14" ]
directory = "./goes19/{region:short|lower}/{channel:short|lower}_enhanced/{time:%Y-%m-%d}"
filename = "goes19_{region:short}_{channel:short}_enhanced_{time:%Y%m%dT%H%M%SZ}"
format = "jpg"
json = false

  ## The following gradients are rough approximations of the 
  ## McIDAS RGB enhancements used by NOAA/NESDIS/STAR on their site..
  ##
  ## For more info:
  ##
  ##   https://www.star.nesdis.noaa.gov/GOES/GOES16_FullDisk.php 
