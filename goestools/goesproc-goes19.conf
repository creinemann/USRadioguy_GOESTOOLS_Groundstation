# NWS text (weather reports).
[[handler]]
type = "text"
origin = "nws"
directory = "./goes19/nws"
filename = "{time:%Y%m%dT%H%M%SZ}_{awips:nnn}{awips:xxx}"
json = false

# NWS images.
[[handler]]
type = "image"
origin = "nws"
directory = "./goes19/nws"
filename = "{time:%Y%m%dT%H%M%SZ}_{filename}"
format = "png"
json = false

# EMWIN
[[handler]] 
type = "emwin"
directory = "./goes19/emwin"
exclude_txt = false

# Miscellaneous text.
[[handler]]
type = "text"
origin = "other"
directory = "./goes19/text"
filename = "{time:%Y%m%dT%H%M%SZ}_{filename}"
json = false

