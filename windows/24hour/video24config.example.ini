; 24-hour video loops for Windows (Create24HourVideos.ps1).
; Copy to video24config.ini next to the script and edit the paths.
; Linux/Pi users: scripts/make-site-config.py writes this for you.
[settings]
ffmpeg = C:\ffmpeg\bin\ffmpeg.exe
videoDir = C:\xampp\htdocs\videos
; where goesproc writes today's images (several roots: separate with |)
liveRoots = D:\goes
; optional archive a nightly task moves older images into
archiveRoots = D:\goes-archive
hours = 24
fps = 15
maxWidth = 1500
crf = 22
minFrames = 6
minSeconds = 8
smooth = yes

; One section per loop. Name = the videoPath in Vitality's .ini (without .mp4).
; sub    = folder under each root   |  paths = full folders (instead of sub)
; filter = only file names containing this text
[GOES19CustomLUT]
sub = goes19\fd\CUSTOMLUT

[GOES19NightLUT]
sub = goes19\fd\CUSTOMLUT_NIGHT

[GOES19FalseColor]
sub = goes19\fd\fc

[GOES19Ch13]
sub = goes19\fd\ch13

[Himawari9FalseColor]
sub = himawari9\fd\fc

[LocalRadar]
sub = goes19\emwin
filter = RADNTHES
