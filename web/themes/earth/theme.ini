; Living Earth - a theme for the USRadioguy GOESTOOLS Ground Station (classic view)
; Earthy greens, soil and sand, with the "Earth" home page: your latest
; GOES GeoColor full disk in the middle and the site's pages circling it.
; Created November 2026. To use: Local Settings > Web App Theme, or set
; siteTheme = "earth" in config.ini (optional).

; Human-readable name of the theme as shown in the web
; interface. SiteTheme in config.ini should use the name of
; the theme's folder, not the human-readable name. Optional
name = "Living Earth"

; Background color used for the theme. Used by the web app's
; manifest for coloring the user's web browser. Optional
themeColor = "#10140e"

; Array of CSS stylesheets to be loaded into the web app.
stylesheets[] = "fonts.css"
stylesheets[] = "style.css"
